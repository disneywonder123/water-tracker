<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroTracker App</title>
    <style>
        :root {
            --primary-blue: #00a8ff;
            --bg-light: #f5f6fa;
            --card-bg: #ffffff;
            --text-dark: #2f3640;
            --text-muted: #718093;
            --accent-orange: #fbc531;
            --accent-green: #4cd137;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 850px;
            background: var(--card-bg);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #2f3640;
        }

        /* Header Styling */
        .app-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .date-badge {
            background: rgba(0, 168, 255, 0.1);
            padding: 8px 12px;
            border-radius: 12px;
            text-align: center;
        }

        .date-badge .day-num {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-blue);
            display: block;
        }

        .date-badge .day-name {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .settings-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        /* Main Silhouette Visualization Area */
        .visualization-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 10px 0;
        }

        .silhouette-box {
            position: relative;
            width: 250px;
            height: 450px;
        }

        /* SVG Masking Layer for the Human Figure Water Fill */
        .silhouette-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        .water-fill-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            clip-path: url(#body-clip);
            background: #e1e8ed;
        }

        .water-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; /* Dynamic fill */
            background: linear-gradient(to top, #7ed6df, var(--primary-blue));
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        /* Progress Metrics Text */
        .progress-bar-wrapper {
            padding: 0 25px;
        }

        .metrics-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .metrics-text strong {
            color: var(--text-dark);
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e1e8ed;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary-blue);
            transition: width 0.6s ease;
        }

        /* Quick Log Controls */
        .controls-panel {
            padding: 15px 25px 30px 25px;
            background: #fdfdfd;
            border-top: 1px solid #f1f2f6;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .log-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 18px;
            padding: 12px 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            color: white;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .log-btn:active { transform: scale(0.95); }

        .btn-coffee { background-color: var(--accent-orange); }
        .btn-smoothie { background-color: var(--accent-green); }
        .btn-glass { background-color: #45aaf2; }
        .btn-bottle { background-color: #2b579a; }

        .btn-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .reset-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        /* Modal Settings Styling */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            width: 85%;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-card h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--text-dark);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
        }

        .save-btn {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header class="app-header">
            <div class="date-badge">
                <span class="day-num" id="header-day">18</span>
                <span class="day-name" id="header-weekday">Monday</span>
            </div>
            <div>
                <h2 style="font-size: 16px; margin-top: 5px;" id="calculated-target-lbl">Target: 90 oz</h2>
            </div>
            <button class="settings-btn" id="open-settings-btn" title="Settings">⚙️</button>
        </header>

        <div class="visualization-container">
            <div class="silhouette-box">
                <svg class="silhouette-svg" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <clipPath id="body-clip">
                            <path d="M50,10 C55,10 59,14 59,19 C59,24 55,28 50,28 C45,28 41,24 41,19 C41,14 45,10 50,10 Z 
                                     M44,30 L56,30 C62,30 65,34 66,40 L71,85 C72,89 69,92 65,92 C62,92 60,89 59,85 L57,52 L57,110 C57,113 55,116 52,116 L48,116 C45,116 43,113 43,110 L43,52 L41,85 C40,89 38,92 34,92 C30,92 28,89 29,85 L34,40 C35,34 38,30 44,30 Z 
                                     M43,118 L47,118 L46,190 C46,194 43,196 39,196 L38,196 C35,196 33,194 33,190 L37,124 L43,118 Z 
                                     M57,118 L53,118 L54,190 C54,194 57,196 61,196 L62,196 C65,196 67,194 67,190 L63,124 L57,118 Z"/>
                        </clipPath>
                    </defs>
                    <path d="M50,10 C55,10 59,14 59,19 C59,24 55,28 50,28 C45,28 41,24 41,19 C41,14 45,10 50,10 Z 
                             M44,30 L56,30 C62,30 65,34 66,40 L71,85 C72,89 69,92 65,92 C62,92 60,89 59,85 L57,52 L57,110 C57,113 55,116 52,116 L48,116 C45,116 43,113 43,110 L43,52 L41,85 C40,89 38,92 34,92 C30,92 28,89 29,85 L34,40 C35,34 38,30 44,30 Z 
                             M43,118 L47,118 L46,190 C46,194 43,196 39,196 L38,196 C35,196 33,194 33,190 L37,124 L43,118 Z 
                             M57,118 L53,118 L54,190 C54,194 57,196 61,196 L62,196 C65,196 67,194 67,190 L63,124 L57,118 Z" 
                          fill="none" stroke="#b2bec3" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
                
                <div class="water-fill-container">
                    <div class="water-fill" id="body-water-fill"></div>
                </div>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <div class="metrics-text">
                <span id="progress-volume-string"><strong>44oz</strong> • 49%</span>
                <span id="remaining-volume-string">Remaining: 46oz</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="status-progress-bar"></div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="button-grid">
                <button class="log-btn btn-coffee" onclick="logFluid(6)">
                    <span class="btn-icon">☕</span><span>6oz</span>
                </button>
                <button class="log-btn btn-smoothie" onclick="logFluid(14)">
                    <span class="btn-icon">🥤</span><span>14oz</span>
                </button>
                <button class="log-btn btn-glass" onclick="logFluid(8)">
                    <span class="btn-icon">🥛</span><span>8oz</span>
                </button>
                <button class="log-btn btn-bottle" onclick="logFluid(16.9)">
                    <span class="btn-icon">🍼</span><span>16.9oz</span>
                </button>
            </div>
            <div class="action-row">
                <button class="reset-btn" onclick="resetLogs()">Reset Today's Log</button>
            </div>
        </div>

        <div class="modal-overlay" id="settings-modal">
            <div class="modal-card">
                <h3>User Metrics & Reminders</h3>
                
                <div class="input-group">
                    <label>Weight (lbs)</label>
                    <input type="number" id="input-weight" value="180">
                </div>
                <div class="input-group">
                    <label>Height (inches)</label>
                    <input type="number" id="input-height" value="68">
                </div>
                <div class="input-group">
                    <label>Age (years)</label>
                    <input type="number" id="input-age" value="59">
                </div>
                <div class="input-group">
                    <label>Reminder Frequency</label>
                    <select id="input-reminder">
                        <option value="0">Disabled</option>
                        <option value="1">Every 1 Hour</option>
                        <option value="2">Every 2 Hours</option>
                        <option value="3">Every 3 Hours</option>
                    </select>
                </div>
                
                <button class="save-btn" id="save-settings-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let currentIntake = 44; // Matches the 44oz state in your screenshot
        let hydrationTarget = 90; // Matches your 90oz target
        let alertIntervalId = null;

        const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const today = new Date();
        document.getElementById('header-day').innerText = today.getDate();
        document.getElementById('header-weekday').innerText = weekdays[today.getDay()];

        const modal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');

        openSettingsBtn.addEventListener('click', () => modal.classList.add('active'));
        saveSettingsBtn.addEventListener('click', () => {
            calculateTargetMetrics();
            configureReminderSystem();
            modal.classList.remove('active');
        });

        function calculateTargetMetrics() {
            const weight = parseFloat(document.getElementById('input-weight').value) || 180;
            let calculatedTarget = weight * 0.5;
            
            const age = parseInt(document.getElementById('input-age').value) || 59;
            if (age > 55) {
                calculatedTarget = calculatedTarget * 0.95; // Age factor calculation adjustments
            }

            // Let's make sure it rounds cleanly to an integer
            hydrationTarget = Math.round(calculatedTarget);
            document.getElementById('calculated-target-lbl').innerText = `Target: ${hydrationTarget} oz`;
            renderVisualProgressDisplay();
        }

        function logFluid(amount) {
            currentIntake += amount;
            renderVisualProgressDisplay();
        }

        function resetLogs() {
            currentIntake = 0;
            renderVisualProgressDisplay();
        }

        function renderVisualProgressDisplay() {
            const displayPercentage = Math.min(Math.round((currentIntake / hydrationTarget) * 100), 100);
            const absoluteRemainingValue = Math.max(0, Math.round(hydrationTarget - currentIntake));

            document.getElementById('progress-volume-string').innerHTML = `<strong>${Math.round(currentIntake)}oz</strong> • ${displayPercentage}%`;
            document.getElementById('remaining-volume-string').innerText = `Remaining: ${absoluteRemainingValue}oz`;
            
            // Seamless rendering: The fill percentage applies directly to the single shared coordinate box
            document.getElementById('body-water-fill').style.height = `${displayPercentage}%`;
            document.getElementById('status-progress-bar').style.width = `${displayPercentage}%`;
        }

        function configureReminderSystem() {
            const selectedIntervalHours = parseFloat(document.getElementById('input-reminder').value);
            
            if (alertIntervalId) {
                clearInterval(alertIntervalId);
                alertIntervalId = null;
            }

            if (selectedIntervalHours > 0) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }

                const millisecondConversionValue = selectedIntervalHours * 3600000; 
                alertIntervalId = setInterval(() => {
                    triggerHydrationAlert();
                }, millisecondConversionValue);

                alert(`Reminders set for every ${selectedIntervalHours} hour(s).`);
            }
        }

        function triggerHydrationAlert() {
            const messageText = "Time to log some water and reach your target!";
            if (Notification.permission === "granted") {
                new Notification("HydroTracker App", { body: messageText, icon: "🥛" });
            } else {
                alert(messageText);
            }
        }

        // Initialize display parameters matching default states
        renderVisualProgressDisplay();
    </script>
</body>
</html>
